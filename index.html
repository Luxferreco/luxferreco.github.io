<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Luxferre. A private House defined by charcoal concrete, obsidian glass, and blackened copper."
    />
    <title>Luxferre</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="home" aria-label="Luxferre homepage">
      <section class="threshold" aria-labelledby="house-title">
        <div class="threshold-image" aria-hidden="true"></div>
        <div class="threshold-vignette" aria-hidden="true"></div>

        <h1 id="house-title" class="engraving">LUXFERRE</h1>

        <button class="enter-button" type="button" data-open-modal>
          Enter the House
        </button>
      </section>
    </main>

    <div class="entry-modal" role="dialog" aria-modal="true" aria-labelledby="entry-title" hidden>
      <div class="modal-scrim" data-close-modal></div>
      <section class="modal-panel" aria-label="Request entry">
        <button class="modal-close" type="button" data-close-modal aria-label="Close entry request">
          Close
        </button>

        <div class="modal-content" data-modal-content>
          <p class="modal-kicker">Private Entry</p>
          <h2 id="entry-title">You&rsquo;ve been seen.</h2>
          <p>
            Entry is not announced.<br />
            It is granted.
          </p>

          <form
            class="entry-form"
            action="https://formspree.io/f/xqeynnel"
            method="POST"
            data-formspree-form
          >
            <label for="email">Email</label>
            <input id="email" type="email" name="email" autocomplete="email" required />
            <button type="submit">Request Entry</button>
          </form>

          <p class="supporting-text">
            Leave your email to be notified when the House opens.
          </p>
        </div>
      </section>
    </div>

    <script src="script.js"></script>
  </body>
</html>
