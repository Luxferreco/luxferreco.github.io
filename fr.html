<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Luxferre</title>

<style>

body{
background:black;
color:white;
font-family:serif;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
text-align:center;

opacity:0;
animation:fadein 1.2s ease forwards;
}

h1{
font-size:56px;
letter-spacing:10px;
margin-bottom:30px;
}

p{
font-size:18px;
color:#bbb;
}
.enter{
display:inline-block;
margin-top:50px;
padding:12px 32px;
border:0.5px solid #888;
color:white;
text-decoration:none;
letter-spacing:3px;
font-size:13px;
transition:all .3s ease;
}

.enter:visited{
color:white;
}
.enter:hover{
border-color:white;
box-shadow:0 0 12px rgba(255,255,255,0.15);
}
.languages{
margin-top:60px;
font-size:11px;
letter-spacing:4px;
color:#aaa;
}
.world{
display:block;
font-size:9px;
letter-spacing:5px;
color:#666;
margin-bottom:8px;
}
@keyframes fadein{
from{
opacity:0;
}

to{
opacity:1;
}
}

</style>

</head>

<body>

<div>

<h1>LUXFERRE</h1>

<p>Forgé dans l’Obscurité</p>

<p>Première Collection — Bientôt Disponiblep</p>

<a href="/house/fr" class="enter">ENTRER DANS LA MAISON</a>

<div class="languages">

<span class="world">MONDE</span>
<br>

<span class="countries">ÉTATS-UNIS | FRANCE | ITALIE | JAPON</span>

</div>

</body>
</html>
