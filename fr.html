<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Luxferre</title>
  <style>
    :root {
      --bg: #000000;
      --fg: #f2f2f2;
      --muted: #9a9a9a;
      --line: #3a3a3a;
      --soft: rgba(255,255,255,0.04);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: "Times New Roman", Georgia, serif;
      min-height: 100%;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
    }

    .page {
      width: 100%;
      max-width: 900px;
      text-align: center;
      position: relative;
    }

    .wordmark {
      font-size: clamp(3rem, 9vw, 6rem);
      letter-spacing: 0.14em;
      font-weight: 700;
      margin: 0 0 28px;
    }

    .tagline,
    .subline {
      color: var(--muted);
      margin: 0;
      line-height: 1.5;
    }

    .tagline {
      font-size: 1.1rem;
      margin-bottom: 10px;
    }

    .subline {
      font-size: 1rem;
      margin-bottom: 44px;
    }

    .primary-btn,
    .submit-btn {
      background: transparent;
      color: var(--fg);
      border: 1px solid var(--line);
      padding: 16px 28px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      cursor: pointer;
      font-size: 0.95rem;
      transition: background 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
    }

    .primary-btn:hover,
    .submit-btn:hover {
      background: var(--soft);
      border-color: #6a6a6a;
      transform: translateY(-1px);
    }

    .presence {
      margin-top: 72px;
    }

    .presence-label {
      color: #6f6f6f;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      font-size: 0.8rem;
      margin-bottom: 18px;
    }

    .presence-links {
      color: #bdbdbd;
      font-size: 0.95rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .presence-links span {
      display: inline-block;
      margin: 0 10px;
      white-space: nowrap;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.92);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.35s ease, visibility 0.35s ease;
    }

    .overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .overlay-card {
      width: 100%;
      max-width: 520px;
      border: 1px solid var(--line);
      padding: 42px 28px;
      background: #050505;
      text-align: center;
    }

    .overlay-title {
      font-size: 1.9rem;
      margin: 0 0 18px;
      letter-spacing: 0.04em;
    }

    .overlay-copy {
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.7;
      margin: 0 0 26px;
    }

    .email-form {
      display: flex;
      gap: 10px;
      flex-direction: column;
      margin-top: 10px;
    }

    .email-input {
      width: 100%;
      background: transparent;
      color: var(--fg);
      border: 1px solid var(--line);
      padding: 15px 16px;
      font-size: 1rem;
      outline: none;
    }

    .email-input::placeholder {
      color: #777;
    }

    .email-input:focus {
      border-color: #7a7a7a;
    }

    .fine {
      color: #777;
      font-size: 0.88rem;
      line-height: 1.6;
      margin-top: 14px;
    }

    .close-btn {
      background: none;
      border: none;
      color: #8a8a8a;
      font-size: 0.9rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      cursor: pointer;
      margin-top: 18px;
    }

    @media (min-width: 560px) {
      .email-form {
        flex-direction: row;
      }

      .email-input {
        flex: 1;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <h1 class="wordmark">LUXFERRE</h1>
    <p class="tagline">Forgé dans l’obscurité</p>
    <p class="subline">Première collection — Bientôt disponible</p>

    <button class="primary-btn" id="openOverlay">Entrer dans la Maison</button>

    <section class="presence">
      <div class="presence-label">Présence</div>
      <div class="presence-links">
        <span>États-Unis</span> |
        <span>France</span> |
        <span>Italie</span> |
        <span>Japon</span>
      </div>
    </section>
  </main>

  <div class="overlay" id="overlay" aria-hidden="true">
    <div class="overlay-card">
      <h2 class="overlay-title">Vous avez été remarqué.</h2>
      <p class="overlay-copy">
        L’entrée n’est pas annoncée.<br />
        Elle est accordée.
      </p>

      <form action="https://formspree.io/f/xqeynnel" method="POST" class="email-form">
        <input
          class="email-input"
          type="email"
          name="email"
          placeholder="Votre e-mail"
          required
          autocomplete="email"
        />

        <input type="hidden" name="source" value="Luxferre FR" />
        <input type="hidden" name="tier" value="Founders List" />

        <button class="submit-btn" type="submit">
          Demander l’entrée
        </button>
      </form>

      <p class="fine">
        Laissez votre e-mail pour être informé lorsque la Maison ouvrira.
      </p>

      <button class="close-btn" id="closeOverlay" type="button">Fermer</button>
    </div>
  </div>

  <script>
    const openOverlay = document.getElementById("openOverlay");
    const closeOverlay = document.getElementById("closeOverlay");
    const overlay = document.getElementById("overlay");
    const emailInput = document.querySelector(".email-input");

    function showOverlay() {
      overlay.classList.add("active");
      overlay.setAttribute("aria-hidden", "false");
      setTimeout(() => emailInput.focus(), 200);
    }

    function hideOverlay() {
      overlay.classList.remove("active");
      overlay.setAttribute("aria-hidden", "true");
    }

    openOverlay.addEventListener("click", showOverlay);
    closeOverlay.addEventListener("click", hideOverlay);

    overlay.addEventListener("click", (e) => {
      if (e.target === overlay) hideOverlay();
    });

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && overlay.classList.contains("active")) {
        hideOverlay();
      }
    });
  </script>
</body>
</html>
