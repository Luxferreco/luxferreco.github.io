<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Luxferre</title>

<style>

body{
background:black;
color:white;
font-family:serif;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
text-align:center;

opacity:0;
animation:fadein 1.2s ease forwards;
}

h1{
font-size:56px;
letter-spacing:10px;
margin-bottom:30px;
}

p{
font-size:18px;
color:#bbb;
}
.enter{
display:inline-block;
margin-top:50px;
padding:12px 32px;
border:0.5px solid #888;
color:white;
text-decoration:none;
letter-spacing:3px;
font-size:13px;
transition:all .3s ease;
}

.enter:visited{
color:white;
}
.enter:hover{
border-color:white;
box-shadow:0 0 12px rgba(255,255,255,0.15);
}
.languages{
margin-top:60px;
font-size:11px;
letter-spacing:4px;
color:#aaa;
}
.world{
display:block;
font-size:9px;
letter-spacing:5px;
color:#666;
margin-bottom:8px;
}
@keyframes fadein{
from{
opacity:0;
}

to{
opacity:1;
}
}

</style>

</head>

<body>

<div>

<h1>LUXFERRE</h1>

<p>影の中で鍛えられた</p>

<p>最初のコレクション — 近日公開</p>

<a href="/house/jp" class="enter">館に入る</a>
    
<div class="languages">

<span class="world">世界</span>
<br>

<span class="countries">
<a href="/">アメリカ合衆国</a> |
<a href="/fr.html">フランス</a> |
<a href="/it.html">イタリア</a> |
<a href="/jp.html">日本</a>
</span>

</div>

</div>

</body>
</html>
